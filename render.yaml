services:
  - type: web
    name: biometric-map
    runtime: python
    region: frankfurt    
    plan: free
    branch: server-v2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_DISPLAY_NAME
        value: المدير العام
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SESSION_HOURS
        value: "12"
      - key: COOKIE_SECURE
        value: "1"
